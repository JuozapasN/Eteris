name: Release

# Pushing a tag like v1.0.0 builds the portable zip and attaches it to a GitHub Release.
# "Run workflow" on the Actions tab builds it too, but only keeps it as a workflow artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build portable zip
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Radio-win-x64
          path: dist/Radio-win-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/Radio-win-x64.zip --title "Radio $env:GITHUB_REF_NAME" --generate-notes
